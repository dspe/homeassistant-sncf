name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: Structure HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: description topics license
  hassfest:
    name: Manifestes Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  templates:
    name: Intégration Home Assistant et scénarios de trains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les outils de validation
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier les fichiers et les scénarios
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/verify_templates.py
